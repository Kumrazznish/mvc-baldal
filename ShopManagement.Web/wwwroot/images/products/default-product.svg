<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="24" fill="#f1f5f9"/>
  
  <!-- Box body -->
  <rect x="40" y="100" width="120" height="75" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Box lid left flap -->
  <polygon points="40,100 100,70 100,100" fill="#94a3b8"/>
  <!-- Box lid right flap -->
  <polygon points="100,100 100,70 160,100" fill="#7c8fa1"/>
  
  <!-- Horizontal line across lid -->
  <line x1="40" y1="100" x2="160" y2="100" stroke="#64748b" stroke-width="1.5"/>
  <!-- Center ridge -->
  <line x1="100" y1="70" x2="100" y2="100" stroke="#64748b" stroke-width="1.5"/>

  <!-- Tag/label on box body -->
  <rect x="72" y="123" width="56" height="30" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <!-- Barcode lines -->
  <line x1="79" y1="128" x2="79" y2="142" stroke="#64748b" stroke-width="1.5"/>
  <line x1="83" y1="128" x2="83" y2="142" stroke="#64748b" stroke-width="2"/>
  <line x1="87" y1="128" x2="87" y2="142" stroke="#64748b" stroke-width="1"/>
  <line x1="90" y1="128" x2="90" y2="142" stroke="#64748b" stroke-width="2"/>
  <line x1="94" y1="128" x2="94" y2="142" stroke="#64748b" stroke-width="1.5"/>
  <line x1="97" y1="128" x2="97" y2="142" stroke="#64748b" stroke-width="1"/>
  <line x1="100" y1="128" x2="100" y2="142" stroke="#64748b" stroke-width="2"/>
  <line x1="104" y1="128" x2="104" y2="142" stroke="#64748b" stroke-width="1.5"/>
  <line x1="107" y1="128" x2="107" y2="142" stroke="#64748b" stroke-width="1"/>
  <line x1="110" y1="128" x2="110" y2="142" stroke="#64748b" stroke-width="2"/>
  <line x1="114" y1="128" x2="114" y2="142" stroke="#64748b" stroke-width="1.5"/>
  <line x1="118" y1="128" x2="118" y2="142" stroke="#64748b" stroke-width="1"/>
  <line x1="121" y1="128" x2="121" y2="142" stroke="#64748b" stroke-width="2"/>
  
  <!-- "No Image" text below -->
  <text x="100" y="165" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#94a3b8" font-weight="600" letter-spacing="0.5">NO IMAGE</text>
  
  <!-- Small image icon at top -->
  <rect x="78" y="28" width="44" height="36" rx="8" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <circle cx="90" cy="42" r="5" fill="#a5b4fc"/>
  <polygon points="78,64 95,50 106,58 116,46 122,64" fill="#818cf8" opacity="0.7"/>
  <!-- Mountain peaks over image icon -->
  <line x1="78" y1="64" x2="122" y2="64" stroke="#a5b4fc" stroke-width="1"/>
</svg>
